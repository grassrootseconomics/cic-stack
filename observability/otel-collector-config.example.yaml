receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: cic-tracker
          metrics_path: "/metrics"
          scrape_interval: 5s
          static_configs:
            - targets: ["celo-tracker:5001"]

exporters:
  otlp:
    endpoint: https://otlp.uptrace.dev:4317
    tls: { insecure: false }
    headers:
      uptrace-dsn: "https://XXX@api.uptrace.dev?grpc=4317"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp]
